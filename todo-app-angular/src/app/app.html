<style>
  table {
    border-collapse: collapse;
    width: 100%;
  }

  th,
  td {
    text-align: left;
    padding: 8px;
  }

  .completed {
    background-color: #d4edda;
    /* light green */
    color: #155724;
  }
</style>

<main class="main">
  <div>
    <h1>Todo List</h1>
    <table>
      <thead>
        <tr>
          <th>
            Task Name
          </th>
          <th>
            Description
          </th>
          <th>
            Actions
          </th>
          <th>
            Status
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of tableData" [class.completed]="item.completed">
          <td>
            {{ item.name }}
          </td>
          <td>
            {{ item.description }}
          </td>
          <td>
            <input type="checkbox" (click)="setCompleted(item.id)" [checked]="item.completed" />
          </td>
          <td>
            {{item.Status}}
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
