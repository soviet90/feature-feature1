<h2 mat-dialog-title>Task Detail</h2>
<mat-dialog-content>
  <form>
    <mat-form-field>
      <mat-label>Task Name</mat-label>
      <input matInput [(ngModel)]="data.tittle" name="Tittle" required />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Description</mat-label>
      <textarea matInput [(ngModel)]="data.description" name="description"></textarea>
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="onSaveClick()">Save</button>

  </form>
</mat-dialog-content>
